name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # We only install the minimal subset needed by the unit tests
        # (torch + monai + pytest) — the full requirements.txt pulls in
        # CUDA-specific wheels and the Foundation-model checkpoints that
        # are not exercised here.
        run: |
          python -m pip install --upgrade pip
          # Pin torch to the CPU build so the matrix doesn't require
          # GPU-enabled runners. The CI test suite is CPU-only by design.
          pip install --index-url https://download.pytorch.org/whl/cpu \
              torch torchvision
          pip install monai pytest

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Compile-check all source files
        run: |
          python -m compileall -q main.py trainer.py utils/ model/ optimizers/
